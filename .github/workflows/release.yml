name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Packages (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
          - arch: arm64
            rid: win-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish Avalonia Desktop
        run: |
          dotnet publish AlyxDesktop/AlyxDesktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/app

      - name: Stage Runtime Bundle & Inno Setup (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\bundle\bin
          New-Item -ItemType Directory -Force -Path dist\bundle\backend
          New-Item -ItemType Directory -Force -Path dist\bundle\run
          New-Item -ItemType Directory -Force -Path dist\bundle\logs

          Copy-Item -Path publish\app\* -Destination dist\bundle\bin -Recurse -Force
          Copy-Item -Path ai.py, api.py, stt_server.py, config.yaml, requirements.txt, alyx.bat, stop.bat, Lancer_Alyx.vbs, Arreter_Alyx.vbs -Destination dist\bundle\backend -Force
          Copy-Item -Path core, function -Destination dist\bundle\backend -Recurse -Force

          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "") { $tag = "v0.1.0" }
          $cleanVersion = $tag.TrimStart('v')

          # 1. Archive ZIP standalone portable
          $zipName = "alyx-${tag}-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path dist\bundle\* -DestinationPath dist\$zipName -Force
          Get-FileHash dist\$zipName -Algorithm SHA256 | Out-File -FilePath dist\$zipName.sha256

          # 2. Compilation de l'installateur Windows Setup.exe (Inno Setup) sur x64
          if ("${{ matrix.arch }}" -eq "x64") {
            choco install innosetup -y --no-progress
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$cleanVersion" installer.iss
            
            $setupFile = Get-ChildItem -Path dist\*.exe | Select-Object -First 1
            if ($setupFile) {
              $setupTarget = "alyx-${tag}-windows-x64-Setup.exe"
              Move-Item -Path $setupFile.FullName -Destination "dist\$setupTarget" -Force
              Get-FileHash "dist\$setupTarget" -Algorithm SHA256 | Out-File -FilePath "dist\$setupTarget.sha256"
            }
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  build-linux:
    name: Build Linux Packages (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            deb_arch: amd64
            rpm_arch: x86_64
            arch_arch: x86_64
          - arch: arm64
            rid: linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
            arch_arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils tar gzip ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Publish Avalonia Desktop
        run: |
          dotnet publish AlyxDesktop/AlyxDesktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o publish/app

      - name: Assemble Linux Payload & Generate Packages (.deb, .rpm, Arch)
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="v0.1.0"; fi
          VERSION="${TAG#v}"

          mkdir -p dist/payload/opt/alyx/bin
          mkdir -p dist/payload/opt/alyx/backend
          mkdir -p dist/payload/opt/alyx/run
          mkdir -p dist/payload/opt/alyx/logs
          mkdir -p dist/payload/usr/bin
          mkdir -p dist/payload/usr/share/applications
          mkdir -p dist/payload/usr/share/pixmaps

          cp -r publish/app/* dist/payload/opt/alyx/bin/
          cp -r core function dist/payload/opt/alyx/backend/
          cp ai.py api.py stt_server.py config.yaml requirements.txt alyx.sh stop.sh dist/payload/opt/alyx/backend/
          chmod +x dist/payload/opt/alyx/bin/AlyxDesktop
          chmod +x dist/payload/opt/alyx/backend/*.sh

          cat << 'EOF' > dist/payload/usr/bin/alyx
          #!/usr/bin/env bash
          exec /opt/alyx/bin/AlyxDesktop "$@"
          EOF
          chmod +x dist/payload/usr/bin/alyx

          cat << 'EOF' > dist/payload/usr/share/applications/alyx.desktop
          [Desktop Entry]
          Name=Alyx
          Comment=Sovereign AI desktop companion
          Exec=/usr/bin/alyx
          Icon=alyx
          Terminal=false
          Type=Application
          Categories=Utility;
          EOF

          # 1. Paquet Debian / Ubuntu (.deb)
          fpm -s dir -t deb \
            -n alyx \
            -v "$VERSION" \
            -a "${{ matrix.deb_arch }}" \
            -m "Alyx Maintainers <support@alyx.local>" \
            --description "Alyx - Sovereign AI Desktop Assistant" \
            -C dist/payload \
            -p dist/alyx-${TAG}-linux-${{ matrix.deb_arch }}.deb .

          sha256sum dist/alyx-${TAG}-linux-${{ matrix.deb_arch }}.deb > dist/alyx-${TAG}-linux-${{ matrix.deb_arch }}.deb.sha256

          # 2. Paquet Fedora / Nobara / RHEL (.rpm)
          fpm -s dir -t rpm \
            -n alyx \
            -v "$VERSION" \
            -a "${{ matrix.rpm_arch }}" \
            -m "Alyx Maintainers <support@alyx.local>" \
            --description "Alyx - Sovereign AI Desktop Assistant" \
            -C dist/payload \
            -p dist/alyx-${TAG}-linux-${{ matrix.rpm_arch }}.rpm .

          sha256sum dist/alyx-${TAG}-linux-${{ matrix.rpm_arch }}.rpm > dist/alyx-${TAG}-linux-${{ matrix.rpm_arch }}.rpm.sha256

          # 3. Paquet Arch Linux (.pkg.tar.gz)
          tar -czf dist/alyx-${TAG}-arch-${{ matrix.arch_arch }}.pkg.tar.gz -C dist/payload .
          sha256sum dist/alyx-${TAG}-arch-${{ matrix.arch_arch }}.pkg.tar.gz > dist/alyx-${TAG}-arch-${{ matrix.arch_arch }}.pkg.tar.gz.sha256

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.gz
            dist/*.sha256

  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          name: "Alyx ${{ github.ref_name }}"
          body: |
            ## 🦅 Alyx — Assistant Local & Souverain (${{ github.ref_name }})

            Alyx est un assistant de bureau 100% hors-ligne, privé et souverain (air-gapped), conçu pour Windows et Linux.

            ---

            ### 📦 Paquets & Installateurs Officiels

            | Système d'exploitation | Architecture | Format de paquet | Fichier à télécharger | Empreinte SHA-256 |
            | :--- | :--- | :--- | :--- | :--- |
            | **Windows 10 / 11** | `x86_64` (x64) | **Installateur Exécutable (.exe)** | [`alyx-${{ github.ref_name }}-windows-x64-Setup.exe`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-windows-x64-Setup.exe) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-windows-x64-Setup.exe.sha256) |
            | **Debian / Ubuntu / Linux Mint** | `x86_64` (amd64) | Paquet natif Debian (.deb) | [`alyx-${{ github.ref_name }}-linux-amd64.deb`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-linux-amd64.deb) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-linux-amd64.deb.sha256) |
            | **Debian / Ubuntu / Linux Mint** | `ARM64` (arm64) | Paquet natif Debian (.deb) | [`alyx-${{ github.ref_name }}-linux-arm64.deb`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-linux-arm64.deb) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-linux-arm64.deb.sha256) |
            | **Fedora / Nobara / RHEL** | `x86_64` | Paquet natif RPM (.rpm) | [`alyx-${{ github.ref_name }}-linux-x86_64.rpm`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-linux-x86_64.rpm) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-linux-x86_64.rpm.sha256) |
            | **Fedora / Nobara / RHEL** | `aarch64` (ARM64) | Paquet natif RPM (.rpm) | [`alyx-${{ github.ref_name }}-linux-aarch64.rpm`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-linux-aarch64.rpm) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-linux-aarch64.rpm.sha256) |
            | **Arch Linux / Manjaro** | `x86_64` | Paquet natif Pacman (.pkg.tar.gz) | [`alyx-${{ github.ref_name }}-arch-x86_64.pkg.tar.gz`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-arch-x86_64.pkg.tar.gz) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-arch-x86_64.pkg.tar.gz.sha256) |
            | **Arch Linux / Manjaro** | `aarch64` (ARM64) | Paquet natif Pacman (.pkg.tar.gz) | [`alyx-${{ github.ref_name }}-arch-aarch64.pkg.tar.gz`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-arch-aarch64.pkg.tar.gz) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-arch-aarch64.pkg.tar.gz.sha256) |

            ---

            ### 💼 Versions Portables Autonomes (Sans installation)

            | Système d'exploitation | Architecture | Format | Fichier à télécharger | Empreinte SHA-256 |
            | :--- | :--- | :--- | :--- | :--- |
            | **Windows 10 / 11** | `x86_64` (x64) | Archive Portable (.zip) | [`alyx-${{ github.ref_name }}-windows-x64.zip`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-windows-x64.zip) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-windows-x64.zip.sha256) |
            | **Windows 11 ARM** | `ARM64` | Archive Portable (.zip) | [`alyx-${{ github.ref_name }}-windows-arm64.zip`](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-windows-arm64.zip) | [SHA256](https://github.com/christyl753/Alyx/releases/download/${{ github.ref_name }}/alyx-${{ github.ref_name }}-windows-arm64.zip.sha256) |

            ---

            ### 🚀 Commandes d'installation rapide

            #### Windows
            - **Installateur (.exe)** : Lancez `alyx-${{ github.ref_name }}-windows-x64-Setup.exe` et suivez l'assistant.
            - **Portable (.zip)** : Décompressez l'archive où vous le souhaitez et lancez `Lancer_Alyx.vbs` ou `bin\AlyxDesktop.exe`.

            #### Debian / Ubuntu / Mint
            ```bash
            sudo apt install ./alyx-${{ github.ref_name }}-linux-amd64.deb
            alyx
            ```

            #### Fedora / Nobara / RHEL
            ```bash
            sudo dnf install ./alyx-${{ github.ref_name }}-linux-x86_64.rpm
            alyx
            ```

            #### Arch Linux / Manjaro
            ```bash
            sudo pacman -U ./alyx-${{ github.ref_name }}-arch-x86_64.pkg.tar.gz
            alyx
            ```

            *Chaque fichier est vérifiable via son checksum SHA-256 (`certutil -hashfile <fichier> SHA256` sous Windows ou `sha256sum <fichier>` sous Linux).*
