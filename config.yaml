# Configuration Globale d'Alyx

server:
  port: 8765
  stt_port: 5001
  min_disk_free_gb: 1.0

network:
  air_gapped: true

llm_provider:
  cache_ttl: 60
  scan_timeout: 1.5
  chat_timeout: 120
  circuit_breaker_max_failures: 3
  circuit_breaker_cooldown: 30
  max_context_messages: 40
  provider_startup_timeout: 10
  max_tool_iterations: 10
  context_length: 4096
  enable_thinking: false
  dynamic_tool_routing: true
  max_concurrency: 1
  min_disk_free_gb: 2.0

providers:
  - name: "ollama"
    api_base: "http://127.0.0.1:11434"
    priority: 1
    auto_start: true
    max_concurrency: 1
  - name: "lmstudio"
    api_base: "http://127.0.0.1:1234"
    priority: 2
    auto_start: true
    max_concurrency: 1
  - name: "nvidia"
    api_base: "http://127.0.0.1:8000"
    priority: 3
    auto_start: false
    max_concurrency: 1

# --- B.4.1 : Paramètres de Contexte & Rétention ---
context:
  nb_tours_recents_verbatim: 2
  retention_jours: 90

# --- B.4.1 : Paramètres des Outils Système ---
tools:
  budget_max_outils: 1000
  max_outils_routage: 6
  max_entrees_liste: 50
  taille_max_lecture: 8192

# --- B.4.1 : Paramètres du Micro-Service Vocal (STT Whisper) ---
stt:
  port: 5001
  model_size: "base"
  sample_rate: 16000
  seuil_muet: 0.0005
  min_disk_free_gb: 1.0

# --- B.8.3 : Paramètres des Tâches Quotidiennes ---
daily_tasks:
  reminders_check_interval: 5
  notes_preview_chars: 120

# --- B.8.5 : Paramètres du Mode Focus / Gaming ---
focus_gaming:
  enabled: true
  auto_unload_vram: true
  check_interval_seconds: 5

# --- B.8.6 : Paramètres de Conscience Contextuelle ---
context_awareness:
  enabled: true
  auto_active_window: true
  auto_clipboard: true
  max_clipboard_chars: 1500
